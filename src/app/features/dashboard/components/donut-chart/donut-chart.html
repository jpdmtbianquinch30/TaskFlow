<svg viewBox="0 0 100 100" class="donut" role="img" [attr.aria-label]="description()">
  <circle class="track" cx="50" cy="50" [attr.r]="radius" />
  @for (a of arcs(); track a.label) {
    <circle
      class="arc"
      cx="50"
      cy="50"
      [attr.r]="radius"
      [attr.stroke]="a.color"
      [attr.stroke-dasharray]="a.dash"
      [attr.stroke-dashoffset]="a.offset"
      transform="rotate(-90 50 50)"
    />
  }
  <text x="50" y="49" class="center-value">{{ centerValue() }}</text>
  <text x="50" y="62" class="center-label">{{ centerLabel() }}</text>
</svg>
